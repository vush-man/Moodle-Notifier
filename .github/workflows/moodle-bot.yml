name: moodle-bot

on:
  schedule:
    - cron: "2,17,32,47 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: moodle-bot
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Restore state
        uses: actions/cache/restore@v5
        with:
          path: moodle_bot.db
          key: moodle-db-${{ github.run_id }}
          restore-keys: |
            moodle-db-

      - name: Run bot (one check)
        run: python moodle_bot.py --once
        env:
          MOODLE_URL: ${{ secrets.MOODLE_URL }}
          MOODLE_TOKEN: ${{ secrets.MOODLE_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_ADMIN_ID: ${{ secrets.TELEGRAM_ADMIN_ID }}
          TOKEN_ENCRYPTION_KEY: ${{ secrets.TOKEN_ENCRYPTION_KEY }}
          SKIP_COURSE_IDS: ${{ vars.SKIP_COURSE_IDS }}
          TZ_OFFSET_MINUTES: ${{ vars.TZ_OFFSET_MINUTES }}
          POLL_MINUTES: ${{ vars.POLL_MINUTES }}
          REMINDER_HOURS: ${{ vars.REMINDER_HOURS }}
          ASSIGN_REMINDER_HOURS: ${{ vars.ASSIGN_REMINDER_HOURS }}
          
      - name: Save state
        if: always()
        uses: actions/cache/save@v5
        with:
          path: moodle_bot.db
          key: moodle-db-${{ github.run_id }}