name: moodle-bot

on:
  schedule:
    - cron: "02,17,32,47 * * * *"
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: moodle-bot
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Restore state
        uses: actions/cache/restore@v4
        with:
          path: moodle_bot.db
          key: moodle-db-${{ github.run_id }}
          restore-keys: |
            moodle-db-

      - name: Run bot (one check)
        run: python moodle_bot.py --once
        env:
          MOODLE_URL: ${{ secrets.MOODLE_URL }}
          MOODLE_TOKEN: ${{ secrets.MOODLE_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SKIP_COURSE_IDS: ${{ vars.SKIP_COURSE_IDS }}

      # Caches can't be overwritten, so each run saves under a new key.
      - name: Save state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: moodle_bot.db
          key: moodle-db-${{ github.run_id }}